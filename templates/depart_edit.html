{% extends 'layout.html' %}

{% block content %}
<div class="panel panel-default">
    <div class="panel-heading">修改部门</div>
    <div class="panel-body">
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label>标题</label>
                <input type="text" name="title" class="form-control" value="{{ row_object.title }}">
            </div>
            <button type="submit" class="btn btn-primary">提交</button>
        </form>
    </div>
</div>
{% endblock %}
